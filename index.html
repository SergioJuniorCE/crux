<!doctype html>
<html lang="en" class="dark">
  <head>
    <style>
      :root {
        color-scheme: dark;
        background: #0a0a0b;
      }

      :root:not(.dark) {
        color-scheme: light;
        background: #f7f7f8;
      }

      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }

      body {
        background:
          radial-gradient(circle at 50% 20%, rgba(245, 197, 24, 0.08), transparent 28rem),
          #0a0a0b;
        color: #ededef;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      :root:not(.dark) body {
        background: #f7f7f8;
        color: #0a0a0b;
      }

      .crux-boot {
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .crux-boot__panel {
        display: grid;
        justify-items: center;
        gap: 1rem;
      }

      .crux-boot__mark {
        width: 2.75rem;
        height: 2.75rem;
        display: grid;
        place-items: center;
        border-radius: 0.875rem;
        background: #f5c518;
        color: #0a0a0b;
        box-shadow:
          0 0 0 1px rgba(245, 197, 24, 0.18),
          0 1.5rem 4rem rgba(245, 197, 24, 0.18);
        animation: crux-boot-pulse 1.6s ease-in-out infinite;
      }

      .crux-boot__text {
        margin: 0;
        color: rgba(237, 237, 239, 0.62);
        font-size: 0.8125rem;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      :root:not(.dark) .crux-boot__text {
        color: rgba(10, 10, 11, 0.58);
      }

      @keyframes crux-boot-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.86;
        }

        50% {
          transform: scale(1.06);
          opacity: 1;
        }
      }
    </style>
    <script>
      try {
        const storedTheme = localStorage.getItem("crux-dark-mode");
        document.documentElement.classList.toggle("dark", storedTheme !== "false");
      } catch {
        document.documentElement.classList.add("dark");
      }
    </script>
    <script type="module">
      // first npm i react-grab
      // then in head:
      if (import.meta.env.DEV) {
        import("react-grab");
      }
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crux</title>
  </head>
  <body>
    <div id="root">
      <div class="crux-boot" aria-label="Loading Crux">
        <div class="crux-boot__panel">
          <div class="crux-boot__mark" aria-hidden="true">
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M13 2L4 14H11L10 22L20 9H13L13 2Z"
                fill="currentColor"
              />
            </svg>
          </div>
          <p class="crux-boot__text">Loading Crux</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
